# Model weights live in models/ (ignored by Git). This manifest says where each file comes from, its SHA-256 and
# its license; `uv run python scripts/fetch_models.py` downloads missing files and checks every hash.

[yunet]
file = "yunet/face_detection_yunet_2023mar.onnx"
