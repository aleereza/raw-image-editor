# Copy this file to config.toml and adjust it for this installation.
# config.toml is ignored by Git, so real paths and local choices stay out of the repository.
# Every key is optional. Commented keys show their defaults; the two set below are examples.

[paths]
# Folder that holds the shoot folders, on the photo drive. The app only reads there (see AGENTS.md).
photos = "/path/to/Photos"
# Previews, renders, analysis, and the settings folder the app gives RawTherapee; safe to delete.
# cache = "~/.cache/rie"
# The catalog, its backups, and copies of RawTherapee sidecars made before the app first adds to them.
# data = "~/.local/share/rie"

[drive]
# Filesystem UUID of the photo drive, as listed in /dev/disk/by-uuid (for NTFS, 16 hex digits).
# `rie check` says whether it is connected, deciding from the device and the mount table only.
uuid = "0123456789ABCDEF"
# Where the drive is expected; when unset, it is found in the mount table by its UUID.
# mountpoint = "/path/to/drive"

[rawtherapee]
# cli = "rawtherapee-cli"
# RT_SETTINGS for every render, so RawTherapee's own preferences never change the app's renders.
# Default: <paths.cache>/rawtherapee.
# settings_dir = "~/.cache/rie/rawtherapee"
# Base profiles that recipes name, such as d7100-base@1; a relative path is relative to this file.
# profiles_dir = "profiles/rawtherapee"
# timeout = 300.0         # seconds per render

[render]
# preview_size = 2048     # long edge of `rie render --preview`, in pixels
# jpeg_quality = 95
# jpeg_subsampling = 3    # 1 = 4:2:0, 2 = 4:2:2, 3 = 4:4:4

[previews]
# Cached copies of the camera's embedded JPEGs, made when a folder opens (plan §6, ADR 0002).
# thumb_size = 512        # grid thumbnails, from the 1620 x 1080 OtherImage
# screen_size = 2048      # loupe copies, from the full-size JpgFromRaw; about your screen's long edge
# jpeg_quality = 85
# workers = 6             # processes making them

[analysis]
# workers = 3             # analysis processes (faces, focus); each needs about 1 GB of memory

[safety]
# Warn when the photo drive has less free space than this; trashed rejects keep using space until you empty the trash.
# min_free_gb = 100

[server]
# `rie serve` listens here; open http://localhost:7317 in a browser.
# host = "127.0.0.1"
# port = 7317

[claude]
# Claude's culling and editing passes (Phase 3), through Claude Code on the signed-in account.
# enabled = true
# model = ""              # empty: whatever model Claude Code is set to

[export]
# Full-size JPEGs written into each shoot folder's jpg/ (plan §6.1). These go into every JPEG's EXIF; empty: left out.
# artist = ""
# copyright = ""
